name: SARIF result link scheme S3

on:
  push:
    branches:
      - ghbb-sarif-link-schemes-20260917-s3
    paths:
      - .github/sarif/ghbb-help-markdown-baseline.sarif
      - .github/workflows/sarif-help-markdown-baseline.yml

permissions:
  contents: read
  security-events: write

concurrency:
  group: sarif-result-link-scheme-s3
  cancel-in-progress: false

jobs:
  upload-sarif:
    name: Upload inert SARIF result link S3
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out owned fixture
        uses: actions/checkout@v4

      - name: Upload inert SARIF result link S3
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: .github/sarif/ghbb-help-markdown-baseline.sarif
          category: ghbb-sarif-link-schemes-20260917-s3
