name: SARIF result Markdown parser S2

on:
  push:
    branches:
      - ghbb-sarif-result-markdown-20260917-s2
    paths:
      - .github/sarif/ghbb-help-markdown-baseline.sarif
      - .github/workflows/sarif-help-markdown-baseline.yml

permissions:
  contents: read
  security-events: write

concurrency:
  group: sarif-result-markdown-parser-s2
  cancel-in-progress: false

jobs:
  upload-sarif:
    name: Upload inert SARIF result parser S2
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out owned fixture
        uses: actions/checkout@v4

      - name: Upload inert SARIF result parser S2
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: .github/sarif/ghbb-help-markdown-baseline.sarif
          category: ghbb-sarif-result-markdown-20260917-s2
