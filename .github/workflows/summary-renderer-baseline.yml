name: Actions summary renderer baseline

on:
  workflow_dispatch:
  pull_request:
    paths:
      - README.md
      - .github/workflows/summary-renderer-baseline.yml

permissions: {}

concurrency:
  group: actions-summary-renderer-baseline
  cancel-in-progress: false

jobs:
  render-summary:
    name: Render benign summary baseline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write inert GitHub Flavored Markdown
        shell: bash
        run: |
          set -euo pipefail
          summary_path="${GITHUB_STEP_SUMMARY:?GITHUB_STEP_SUMMARY is unavailable}"

          cat >>"${summary_path}" <<'MARKDOWN'
          # Actions summary renderer baseline

          **Marker:** `GHBB-ACTIONS-SUMMARY-BASELINE-20260917-A1`

          <span id="ghbb-summary-delta-20260917-a1">This is benign researcher-controlled text.</span>

          ```mermaid
          flowchart LR
            A["<span id='ghbb-mermaid-html-20260917-m2'>GHBB-MERMAID-HTML-20260917-M2</span>"] --> B["GHBB-MERMAID-BASELINE-20260917-M1-B"]
          ```

          > Baseline blockquote: static content only.

          - Unordered list item
          - Second unordered list item

          1. Ordered list item
          2. Second ordered list item

          - [x] Expected static task
          - [ ] Intentionally incomplete static task

          | Field | Value |
          | --- | --- |
          | marker | `GHBB-ACTIONS-SUMMARY-BASELINE-20260917-A1` |
          | content | inert |

          ```text
          GHBB-ACTIONS-SUMMARY-CODE-20260917-A1
          ```

          <details>
          <summary>Expand static details</summary>

          GHBB-ACTIONS-SUMMARY-DETAILS-20260917-A1

          </details>
          MARKDOWN

      - name: Emit inert file-bound notice
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '::notice file=README.md,line=1,endLine=1,title=GHBB-ACTIONS-ANNOTATION-TITLE-20260917-A1::GHBB-ACTIONS-ANNOTATION-MESSAGE-20260917-A1'
