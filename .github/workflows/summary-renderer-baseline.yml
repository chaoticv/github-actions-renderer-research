name: Actions summary renderer baseline

on:
  workflow_dispatch:
  pull_request:
    paths:
      - README.md
      - .github/workflows/summary-renderer-baseline.yml

permissions:
  checks: write

concurrency:
  group: actions-summary-renderer-baseline
  cancel-in-progress: false

jobs:
  render-summary:
    name: Render benign summary baseline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write inert GitHub Flavored Markdown
        shell: bash
        run: |
          set -euo pipefail
          summary_path="${GITHUB_STEP_SUMMARY:?GITHUB_STEP_SUMMARY is unavailable}"

          cat >>"${summary_path}" <<'MARKDOWN'
          # Actions summary renderer baseline

          **Marker:** `GHBB-ACTIONS-SUMMARY-BASELINE-20260917-A1`

          This is *benign researcher-controlled text*.

          > Baseline blockquote: static content only.

          - Unordered list item
          - Second unordered list item

          1. Ordered list item
          2. Second ordered list item

          - [x] Expected static task
          - [ ] Intentionally incomplete static task

          | Field | Value |
          | --- | --- |
          | marker | `GHBB-ACTIONS-SUMMARY-BASELINE-20260917-A1` |
          | content | inert |

          ```text
          GHBB-ACTIONS-SUMMARY-CODE-20260917-A1
          ```

          <details>
          <summary>Expand static details</summary>

          GHBB-ACTIONS-SUMMARY-DETAILS-20260917-A1

          </details>
          MARKDOWN

      - name: Create inert Check Run Markdown baseline
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          payload_path="${RUNNER_TEMP}/ghbb-check-run-baseline.json"

          jq -n \
            --arg name 'GHBB Check Run renderer baseline' \
            --arg head_sha "${CHECK_HEAD_SHA}" \
            --arg title 'GHBB-CHECK-TITLE-BASELINE-20260917-C1' \
            --arg summary $'## Check Run summary renderer baseline\n\n**Marker:** `GHBB-CHECK-SUMMARY-BASELINE-20260917-C1`\n\nThis is *benign researcher-controlled Markdown*.\n\n- Static list item\n- Second static list item\n\n[Owned HTTPS link](https://github.com/chaoticv/github-actions-renderer-research#ghbb-check-summary-c1)\n\n<span id="ghbb-check-summary-span-20260917-c2">GHBB-CHECK-SUMMARY-SPAN-20260917-C2</span>' \
            --arg text $'### Check Run text renderer baseline\n\n`GHBB-CHECK-TEXT-BASELINE-20260917-C1`\n\n> Static expanded-text control.\n\n<span id="ghbb-check-summary-span-20260917-c2">GHBB-CHECK-SUMMARY-SPAN-20260917-C2</span>' \
            '{name: $name, head_sha: $head_sha, status: "completed", conclusion: "success", output: {title: $title, summary: $summary, text: $text}}' \
            > "${payload_path}"

          gh api \
            --method POST \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/check-runs" \
            --input "${payload_path}" \
            >/dev/null

      - name: Emit inert file-bound notice
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '::notice file=README.md,line=1,endLine=1,title=GHBB-ACTIONS-ANNOTATION-TITLE-20260917-A1::GHBB-ACTIONS-ANNOTATION-MESSAGE-URL-20260917-A3 https://github.com/chaoticv/github-actions-renderer-research#ghbb-annotation-url-20260917-a3'
